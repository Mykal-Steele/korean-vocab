name: Site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Renders audio for words that have no clip yet, and commits the result to the
  # PR branch. Only same-repo branches: a fork cannot be pushed to from here.
  audio:
    name: Render missing audio
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install the speech tools
        run: |
          python3 -m venv "$RUNNER_TEMP/tts"
          "$RUNNER_TEMP/tts/bin/pip" install gTTS==2.5.4 piper-tts==1.8.0
      - name: Fetch the English voice
        run: |
          mkdir -p "$RUNNER_TEMP/piper"
          base=https://huggingface.co/rhasspy/piper-voices/resolve/5041a7a49ae5b3a0f30e6837769eb03fdbb231bd/en/en_US/lessac/medium
          curl -fsSL -o "$RUNNER_TEMP/piper/en.onnx" "$base/en_US-lessac-medium.onnx"
          curl -fsSL -o "$RUNNER_TEMP/piper/en.onnx.json" "$base/en_US-lessac-medium.onnx.json"
      - name: Render the clips that are missing
        run: |
          "$RUNNER_TEMP/tts/bin/python" tools/build-audio.py \
            --piper "$RUNNER_TEMP/tts/bin/python" \
            --en-model "$RUNNER_TEMP/piper/en.onnx" \
            --en-config "$RUNNER_TEMP/piper/en.onnx.json" \
            --gtts "$RUNNER_TEMP/tts/bin/python"
      - name: Commit and push the new clips
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio assets/js/audio.js
          if git diff --cached --quiet; then
            echo "no new clips to commit"
            exit 0
          fi
          git commit -m "Render audio for new words"
          git push origin "HEAD:$HEAD_REF"

  check:
    name: Check and build
    needs: [audio]
    if: ${{ always() && needs.audio.result != 'failure' && needs.audio.result != 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # After the audio job pushes, check the new commit on the branch, not the old one.
          ref: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref || github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate the word data
        run: node tools/check-data.js
      - name: Install the test dependencies
        run: python3 -m pip install pyyaml==6.0.3
      - name: Run the tests
        run: python3 -m unittest discover -s tests -v
      - name: Build the hosted site and the artifact copy
        run: |
          python3 build.py --site
          python3 build.py

  deploy:
    name: Upload to R2
    needs: check
    # always() stops the skipped audio job from skipping this job too
    if: ${{ always() && needs.check.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    # The production environment holds the R2 keys and requires a reviewer to approve each deploy.
    environment: production
    concurrency:
      group: deploy-site
      cancel-in-progress: false
    env:
      R2_BUCKET: adorio-hosted
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install rclone
        # Pinned to the version that was tested. The Ubuntu package (1.60) did not
        # store the Cache-Control header on uploads.
        run: |
          curl -fsSLO https://downloads.rclone.org/v1.75.2/rclone-v1.75.2-linux-amd64.zip
          echo "349ac8fba6ff65d6247043f1750cdcb518ec5d500ef91463a10d37c0ccdf3702  rclone-v1.75.2-linux-amd64.zip" | sha256sum -c -
          unzip -q rclone-v1.75.2-linux-amd64.zip
          sudo install rclone-v1.75.2-linux-amd64/rclone /usr/local/bin/rclone
          rclone version
      - name: Build the hosted site
        run: python3 build.py --site
      - name: Upload the assets first
        # copy never deletes, so anything else in the bucket is left alone
        run: |
          rclone copy dist/site/learn-korean "r2:$R2_BUCKET/learn-korean" \
            --ignore-times \
            --header-upload "Cache-Control: public, max-age=31536000, immutable"
      - name: Upload the entry page last
        run: |
          rclone copyto dist/site/learn-korean.html "r2:$R2_BUCKET/learn-korean.html" \
            --ignore-times \
            --header-upload "Cache-Control: no-cache" \
            --header-upload "Content-Type: text/html; charset=utf-8"
      - name: Check the stored cache headers
        # rclone copy skips files that look unchanged, so a missing header on an old object
        # would stay missing. Read the headers back and fail if any are wrong.
        run: |
          rclone lsjson -M -R "r2:$R2_BUCKET/learn-korean" > stored.json
          rclone lsjson -M "r2:$R2_BUCKET/learn-korean.html" > entry.json
          python3 - <<'PY'
          import json, os, sys
          # Only the files in this build. Older objects that nothing links to are not checked.
          built = set()
          for root, _, files in os.walk("dist/site/learn-korean"):
              for name in files:
                  built.add(os.path.relpath(os.path.join(root, name), "dist/site/learn-korean"))
          stored = {item["Path"]: item for item in json.load(open("stored.json")) if not item["IsDir"]}
          bad = []
          for path in sorted(built):
              item = stored.get(path)
              cc = ((item or {}).get("Metadata") or {}).get("cache-control", "")
              if item is None:
                  bad.append(f"learn-korean/{path}: missing from R2")
              elif "immutable" not in cc:
                  bad.append(f"learn-korean/{path}: {cc or 'no header'}")
          for item in json.load(open("entry.json")):
              cc = (item.get("Metadata") or {}).get("cache-control", "")
              if "no-cache" not in cc:
                  bad.append(f"learn-korean.html: {cc or 'no header'}")
          if bad:
              print("\n".join(bad[:20]))
              print(f"{len(bad)} object(s) have the wrong cache-control")
              sys.exit(1)
          print("every stored object has the expected cache-control")
          PY
      - name: Check the stored entry page matches the build
        # Read from R2, not the public URL: Cloudflare injects a script into HTML served
        # on the adorio.space zone, so the public copy never matches the build byte for byte.
        run: |
          expected=$(sha256sum dist/site/learn-korean.html | cut -d' ' -f1)
          actual=$(rclone cat "r2:$R2_BUCKET/learn-korean.html" | sha256sum | cut -d' ' -f1)
          if [ "$actual" != "$expected" ]; then
            echo "stored entry page does not match the build" >&2
            exit 1
          fi
          echo "stored entry page matches the build"
      - name: Check one script and one clip are reachable
        run: |
          script=$(ls dist/site/learn-korean/js/app.*.js | head -1)
          clip=$(ls dist/site/learn-korean/audio/*.mp3 | head -1)
          curl -sfS -o /dev/null "https://files.adorio.space/learn-korean/${script#dist/site/learn-korean/}"
          curl -sfS -o /dev/null "https://files.adorio.space/learn-korean/${clip#dist/site/learn-korean/}"
